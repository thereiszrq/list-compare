<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>名单对比工具</title>
<meta name="description" content="对比两个或多个名单列表的差异，支持交集、独有、并集、逐项对照">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="名单对比">
<link rel="manifest" href="data:application/json,{'name':'名单对比工具','short_name':'名单对比','start_url':'.','display':'standalone','background_color':'#f9fafb','theme_color':'#4f46e5','icons':[]}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --primary: #4f46e5; --primary-light: #eef2ff; --danger: #dc2626; --success: #16a34a;
  --warning: #f59e0b; --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
  --gray-300: #d1d5db; --gray-400: #9ca3af; --gray-500: #6b7280; --gray-600: #4b5563;
  --gray-700: #374151; --gray-800: #1f2937; --gray-900: #111827;
  --radius: 8px; --shadow: 0 1px 3px rgba(0,0,0,.1);
  --list-1: #4f46e5; --list-1-bg: #eef2ff;
  --list-2: #16a34a; --list-2-bg: #dcfce7;
  --list-3: #f59e0b; --list-3-bg: #fef9c3;
  --list-4: #dc2626; --list-4-bg: #fee2e2;
  --list-5: #8b5cf6; --list-5-bg: #ede9fe;
  --list-6: #06b6d4; --list-6-bg: #cffafe;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--gray-50);color:var(--gray-800);line-height:1.6;min-height:100vh;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{max-width:1100px;margin:0 auto;padding:16px}

.header{background:white;border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.header h1{font-size:20px;font-weight:700;white-space:nowrap}
.header-actions{display:flex;gap:6px;flex-wrap:wrap}

.tabs{display:flex;gap:4px;margin-bottom:16px;background:white;border-radius:var(--radius);padding:4px;box-shadow:var(--shadow)}
.tab{flex:1;padding:12px 12px;border:none;background:transparent;cursor:pointer;border-radius:6px;font-size:14px;font-weight:500;color:var(--gray-500);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px}
.tab:hover{background:var(--gray-50);color:var(--gray-700)}
.tab.active{background:var(--primary);color:white}
.tab .step-num{width:22px;height:22px;border-radius:50%;background:var(--gray-200);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--gray-600);flex-shrink:0}
.tab.active .step-num{background:rgba(255,255,255,.3);color:white}

.panel{display:none;background:white;border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow);min-height:400px}
.panel.active{display:block}

.btn{padding:10px 18px;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px;min-height:44px;-webkit-tap-highlight-color:transparent}
.btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:#4338ca}
.btn-outline{background:white;border:1px solid var(--gray-300);color:var(--gray-700)}.btn-outline:hover{background:var(--gray-50)}
.btn-danger{background:var(--danger);color:white}.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:7px 14px;font-size:12px;min-height:36px}.btn-xs{padding:5px 10px;font-size:12px;min-height:32px}
.btn:disabled{opacity:.5;cursor:not-allowed}

textarea.textarea{width:100%;min-height:150px;padding:14px;border:2px dashed var(--gray-300);border-radius:var(--radius);font-size:16px;font-family:inherit;resize:vertical;line-height:1.6}
textarea.textarea:focus{outline:none;border-color:var(--primary)}

.section-title{font-size:15px;font-weight:600;color:var(--gray-900);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--gray-100)}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--gray-600);margin-bottom:4px}
.form-group input{width:100%;padding:10px 12px;border:1px solid var(--gray-300);border-radius:6px;font-size:16px;min-height:44px}
.form-group input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.row{display:flex;gap:12px}.row>*{flex:1}

.tag{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;background:var(--gray-100);border-radius:14px;font-size:13px;margin:3px;min-height:32px}
.tag .remove{cursor:pointer;font-weight:700;color:var(--gray-400);margin-left:4px;font-size:18px;padding:2px 4px;min-height:32px;min-width:32px;display:inline-flex;align-items:center;justify-content:center}
.tag .remove:hover{color:var(--danger)}

.drop-zone{border:2px dashed var(--gray-300);border-radius:var(--radius);padding:20px 16px;text-align:center;cursor:pointer;transition:all .15s;margin-top:8px;min-height:60px;display:flex;align-items:center;justify-content:center;gap:6px}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--primary);background:var(--primary-light)}
.drop-zone p{color:var(--gray-500);font-size:14px;margin:0}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:12px 24px;background:var(--gray-900);color:white;border-radius:8px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}

/* ---- List input groups ---- */
.list-group{border:2px solid var(--gray-200);border-radius:var(--radius);padding:16px;margin-bottom:12px;position:relative;transition:border-color .15s}
.list-group:nth-child(1){border-left:4px solid var(--list-1)}
.list-group:nth-child(2){border-left:4px solid var(--list-2)}
.list-group:nth-child(3){border-left:4px solid var(--list-3)}
.list-group:nth-child(4){border-left:4px solid var(--list-4)}
.list-group:nth-child(5){border-left:4px solid var(--list-5)}
.list-group:nth-child(6){border-left:4px solid var(--list-6)}
.list-group-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.list-group-header input{flex:1;border:1px solid var(--gray-200);padding:8px 12px;border-radius:4px;font-size:15px;font-weight:600;min-height:44px;color:var(--gray-800);background:var(--gray-50)}
.list-group-header input:focus{outline:none;border-color:var(--primary)}
.list-count{font-size:12px;color:var(--gray-500);white-space:nowrap}
.item-preview{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px;max-height:130px;overflow:auto;-webkit-overflow-scrolling:touch}
.empty-hint{color:var(--gray-400);font-size:13px;padding:8px 0}

/* ---- Add list button ---- */
.add-list-area{text-align:center;padding:16px;border:2px dashed var(--gray-200);border-radius:var(--radius);cursor:pointer;transition:all .15s;color:var(--gray-500);font-size:15px;min-height:52px;display:flex;align-items:center;justify-content:center}
.add-list-area:hover,.add-list-area:active{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}

/* ---- Mode selector ---- */
.mode-selector{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.mode-btn{flex:1;min-width:70px;padding:12px 10px;border:1px solid var(--gray-200);background:var(--gray-50);cursor:pointer;border-radius:6px;font-size:13px;font-weight:500;color:var(--gray-600);transition:all .15s;min-height:48px}
.mode-btn:hover{background:var(--primary-light);color:var(--primary)}
.mode-btn.active{background:var(--primary);color:white;border-color:var(--primary)}

/* ---- Stat cards ---- */
.stat-cards{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{flex:1;min-width:90px;background:var(--gray-50);border-radius:var(--radius);padding:14px 16px;text-align:center;border:1px solid var(--gray-200)}
.stat-card .stat-num{font-size:28px;font-weight:700;color:var(--gray-900);line-height:1.2}
.stat-card .stat-label{font-size:12px;color:var(--gray-500);margin-top:2px}

/* ---- Results area ---- */
.result-section{margin-bottom:16px}
.result-section .section-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.result-list{display:flex;flex-wrap:wrap;gap:5px}
.list-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}

/* ---- Compare table ---- */
.compare-table-wrap{overflow-x:auto;border:1px solid var(--gray-200);border-radius:var(--radius);max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.compare-table{width:100%;border-collapse:collapse;font-size:14px;min-width:400px}
.compare-table th{position:sticky;top:0;background:var(--gray-100);padding:10px 14px;text-align:left;font-weight:600;font-size:13px;color:var(--gray-700);border-bottom:2px solid var(--gray-200);z-index:1}
.compare-table th.cell-list{text-align:center;min-width:50px}
.compare-table td{padding:10px 14px;border-bottom:1px solid var(--gray-100)}
.compare-table td.cell-list{text-align:center}
.compare-table tr:hover td{background:var(--gray-50)}
.compare-table .mark-yes{color:var(--success);font-weight:700;font-size:18px}
.compare-table .mark-no{color:var(--gray-300);font-size:18px}

/* ---- Mobile card view (替代表格) ---- */
.card-list{display:none}
.card-item{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px}
.card-item .card-name{font-size:15px;font-weight:600;margin-bottom:6px}
.card-item .card-lists{display:flex;gap:6px;flex-wrap:wrap}
.card-item .card-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:500}
.card-item .card-badge.in{opacity:1}
.card-item .card-badge.out{opacity:.25;text-decoration:line-through}

/* ---- Export ---- */
.export-options{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.export-options .btn{flex:1;min-width:80px}
.export-preview{border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px;background:var(--gray-50);max-height:400px;overflow:auto;white-space:pre-wrap;font-size:13px;font-family:monospace;line-height:1.5;-webkit-overflow-scrolling:touch}

/* ---- Options row ---- */
.options-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.options-row label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--gray-600);cursor:pointer;min-height:44px}
.options-row input[type="checkbox"]{width:20px;height:20px;accent-color:var(--primary)}

/* ---- File preview modal ---- */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:white;border-radius:12px;padding:20px;max-width:700px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}

.preview-table{border-collapse:collapse;font-size:13px;width:100%}
.preview-table th{cursor:pointer;background:var(--gray-100);padding:8px 12px;text-align:left;border-bottom:2px solid var(--gray-200);position:sticky;top:0;z-index:1;white-space:nowrap;user-select:none;font-weight:500;font-size:12px}
.preview-table th:hover{background:var(--primary-light)}
.preview-table th.selected{background:var(--primary);color:white}
.preview-table td{padding:6px 12px;border-bottom:1px solid var(--gray-100);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.preview-table tr:hover td{background:var(--gray-50)}
.preview-table .row-num{color:var(--gray-400);font-size:11px;text-align:right;background:var(--gray-50)}

/* ---- No results placeholder ---- */
.no-results{text-align:center;padding:60px 20px;color:var(--gray-400)}
.no-results .icon{font-size:48px;margin-bottom:12px}

/* ---- Swipe hint for mobile ---- */
.mobile-swipe-hint{display:none;font-size:11px;color:var(--gray-400);text-align:center;margin-top:6px}

/* ==================== RESPONSIVE ==================== */
@media (max-width:768px){
  .app{padding:8px}
  .header{padding:12px 14px;flex-direction:column;text-align:center}
  .header h1{font-size:18px}
  .header-actions{width:100%;justify-content:center}
  .header-actions .btn{flex:1;min-width:0;justify-content:center}

  .tabs{gap:2px;margin-bottom:10px}
  .tab{font-size:12px;padding:10px 4px;gap:4px;min-height:44px;flex-direction:column}
  .tab .step-num{width:20px;height:20px;font-size:10px}

  .panel{padding:16px 12px;min-height:300px;border-radius:6px}

  .btn{min-height:44px;padding:10px 16px;font-size:14px}
  .btn-sm{min-height:40px;padding:8px 14px;font-size:13px}
  .btn-xs{min-height:36px;padding:6px 12px;font-size:12px}

  .section-title{font-size:14px}
  .row{flex-direction:column;gap:8px}

  .toast{top:10px;font-size:13px;padding:10px 18px}

  .list-group{padding:12px;margin-bottom:10px}
  .list-group-header{flex-wrap:wrap;gap:6px}
  .list-count{font-size:11px}

  .tag{padding:6px 14px;font-size:14px;min-height:36px;margin:2px}
  .tag .remove{min-height:36px;min-width:36px;font-size:20px}

  .mode-selector{gap:3px;margin-bottom:16px}
  .mode-btn{font-size:11px;padding:10px 6px;min-height:44px}
  .stat-cards{gap:6px}
  .stat-card{padding:12px 10px;min-width:0;flex:1 1 calc(50% - 3px)}
  .stat-card .stat-num{font-size:24px}

  /* 表格在小屏隐藏，显示卡片 */
  .compare-table-wrap{display:none}
  .card-list{display:block}
  .mobile-swipe-hint{display:block}

  .compare-table{font-size:12px}
  .compare-table th,.compare-table td{padding:8px 10px}

  .options-row{gap:10px}
  .options-row label{font-size:14px}

  .modal{padding:16px;max-height:90vh;border-radius:10px}
  .preview-table{font-size:11px}
  .preview-table th,.preview-table td{padding:5px 6px}

  .export-options .btn{min-width:0}

  .result-section .section-title{font-size:13px}

  textarea.textarea{min-height:130px;font-size:16px}

  .add-list-area{min-height:56px;font-size:16px}
}

@media (max-width:400px){
  .tab{font-size:10px;padding:6px 2px}
  .tab .step-num{width:16px;height:16px;font-size:9px}
  .mode-btn{font-size:10px;padding:8px 4px;min-height:40px}
  .stat-card .stat-num{font-size:20px}
  .stat-card .stat-label{font-size:10px}
  .list-group-header input{font-size:14px;min-height:40px}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>名单对比工具</h1>
    <div class="header-actions">
      <button class="btn btn-sm btn-outline" onclick="saveToFile()">保存项目</button>
      <button class="btn btn-sm btn-outline" onclick="document.getElementById('loadFile').click()">加载项目</button>
      <button class="btn btn-sm btn-outline" onclick="resetAll()">清空</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab(0)"><span class="step-num">1</span>输入名单</button>
    <button class="tab" onclick="switchTab(1)"><span class="step-num">2</span>对比结果</button>
    <button class="tab" onclick="switchTab(2)"><span class="step-num">3</span>导出</button>
  </div>

  <!-- Panel 0: 输入名单 -->
  <div class="panel active" id="panel-0">
    <div class="options-row">
      <label><input type="checkbox" id="optCase" onchange="toggleCase()">区分大小写</label>
    </div>
    <div id="listInputs"></div>
    <div class="add-list-area" id="addListBtn" onclick="addList()">+ 添加名单</div>
  </div>

  <!-- Panel 1: 对比结果 -->
  <div class="panel" id="panel-1">
    <div class="mode-selector">
      <button class="mode-btn active" onclick="switchMode('side-by-side')">逐项对照</button>
      <button class="mode-btn" onclick="switchMode('intersection')">交集</button>
      <button class="mode-btn" onclick="switchMode('unique')">独有项</button>
      <button class="mode-btn" onclick="switchMode('union')">并集</button>
    </div>
    <div class="stat-cards" id="statCards"></div>
    <div id="resultsArea"></div>
  </div>

  <!-- Panel 2: 导出 -->
  <div class="panel" id="panel-2">
    <div class="section-title">导出对比结果</div>
    <div class="export-options">
      <button class="btn btn-outline" onclick="exportTXT()">导出 TXT</button>
      <button class="btn btn-outline" onclick="exportCSV()">导出 CSV</button>
      <button class="btn btn-outline" onclick="exportExcel()">导出 Excel</button>
      <button class="btn btn-primary" onclick="copyToClipboard()">复制到剪贴板</button>
    </div>
    <div class="section-title" style="margin-top:16px">预览</div>
    <div class="export-preview" id="exportPreview">请先在"对比结果"中查看对比，然后回到此处导出。</div>
  </div>
</div>

<div class="modal-overlay" id="filePreviewModal">
  <div class="modal" style="max-width:90vw">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:4px">
      <h3 style="margin:0;font-size:17px">选择导入数据</h3>
      <span style="font-size:12px;color:var(--gray-500)">点击列标题选择列，再点取消选中</span>
    </div>
    <div style="max-height:50vh;overflow:auto;border:1px solid var(--gray-200);border-radius:8px" id="previewTableWrap"></div>
    <div class="options-row" style="margin-top:12px">
      <label>导入到：<span id="previewTargetLabel" style="font-weight:600"></span></label>
      <label>从第 <input type="number" id="previewRowStart" value="1" min="1" style="width:60px;text-align:center;min-height:36px"> 行到第 <input type="number" id="previewRowEnd" value="" min="1" style="width:60px;text-align:center;min-height:36px"> 行</label>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
      <button class="btn btn-outline" onclick="closeFilePreview()">取消</button>
      <button class="btn btn-primary" onclick="confirmFileImport()">确认导入</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="loadFile" hidden accept=".json" onchange="loadFromFile(this)">
<input type="file" id="fileInput" hidden accept=".csv,.xlsx,.xls,.txt" onchange="handleListFileUpload(this)">

<script>
// ==================== STATE ====================
var DEFAULT_STATE = {
  lists: [
    { id: 1, label: '名单 A', items: [] },
    { id: 2, label: '名单 B', items: [] }
  ],
  nextId: 3,
  mode: 'side-by-side',
  caseSensitive: false,
  activeTab: 0
};

var LIST_COLORS = [
  { fg: '#4f46e5', bg: '#eef2ff' },
  { fg: '#16a34a', bg: '#dcfce7' },
  { fg: '#f59e0b', bg: '#fef9c3' },
  { fg: '#dc2626', bg: '#fee2e2' },
  { fg: '#8b5cf6', bg: '#ede9fe' },
  { fg: '#06b6d4', bg: '#cffafe' }
];

var state = JSON.parse(JSON.stringify(DEFAULT_STATE));
var resultsCache = null;
var collectTimer = null;
var previewData = null;      // { rows: [[cell,...]], listId: number, fileName: string }
var previewSelectedCol = -1; // selected column index for import

// ==================== PERSISTENCE ====================
function saveState() { localStorage.setItem('list-compare-v1', JSON.stringify(state)); }
function loadState() {
  var s = localStorage.getItem('list-compare-v1');
  if (s) try { state = JSON.parse(s); } catch(e) {}
}
loadState();
// Ensure state integrity
if (!state.nextId) state.nextId = Math.max.apply(null, state.lists.map(function(l){ return l.id; })) + 1;
if (!state.mode) state.mode = 'side-by-side';

// ==================== TOAST ====================
function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + (type||'') + ' show';
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

// ==================== TABS ====================
function switchTab(idx) {
  state.activeTab = idx;
  var tabs = document.querySelectorAll('.tab');
  var panels = document.querySelectorAll('.panel');
  for (var i = 0; i < tabs.length; i++) { tabs[i].classList.toggle('active', i===idx); }
  for (var i = 0; i < panels.length; i++) { panels[i].classList.toggle('active', i===idx); }
  if (idx === 0) { renderListInputs(); }
  if (idx === 1) { resultsCache = null; renderResults(); }
  if (idx === 2) { renderExport(); }
  saveState();
}

// ==================== HELPERS ====================
function normalize(s) {
  var t = s.trim();
  return state.caseSensitive ? t : t.toLowerCase();
}

function getListColor(i) {
  return LIST_COLORS[i % LIST_COLORS.length];
}

function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function collectItems() {
  for (var i = 0; i < state.lists.length; i++) {
    var ta = document.getElementById('ta-' + state.lists[i].id);
    if (!ta) continue;
    var lines = ta.value.split(/[\n\r]+/).filter(function(l){ return l.trim(); });
    var seen = {};
    var items = [];
    for (var j = 0; j < lines.length; j++) {
      var item = lines[j].trim();
      var key = normalize(item);
      if (item && !seen[key]) { seen[key] = true; items.push(item); }
    }
    state.lists[i].items = items;
  }
  saveState();
}

// ==================== PANEL 0: LIST INPUTS ====================
function renderListInputs() {
  var container = document.getElementById('listInputs');
  if (!container) return;
  var html = '';
  for (var i = 0; i < state.lists.length; i++) {
    var list = state.lists[i];
    var col = getListColor(i);
    var itemsStr = list.items.join('\n');
    var canRemove = state.lists.length > 2;
    html += '<div class="list-group">';
    html += '<div class="list-group-header">';
    html += '<input value="' + escAttr(list.label) + '" placeholder="名单名称" oninput="updateListLabel(' + list.id + ', this.value)" style="border-left:3px solid ' + col.fg + '">';
    html += '<span class="list-count">' + list.items.length + ' 项</span>';
    html += '<button class="btn btn-xs btn-outline" onclick="document.getElementById(\'fileInput\').dataset.listId=' + list.id + ';document.getElementById(\'fileInput\').click()" title="上传文件">上传文件</button>';
    if (canRemove) html += '<button class="btn btn-xs btn-danger" onclick="removeList(' + list.id + ')" title="删除此名单">删除</button>';
    html += '</div>';
    html += '<textarea class="textarea" id="ta-' + list.id + '" placeholder="粘贴名单，每行一项&#10;支持从 Excel/CSV/TXT 粘贴&#10;自动去重去空" oninput="onTextareaChange(' + list.id + ')">' + escHtml(itemsStr) + '</textarea>';
    html += '<div class="item-preview" id="preview-' + list.id + '">' + renderItemTags(list.items, i) + '</div>';
    html += '</div>';
  }
  container.innerHTML = html;
}

function renderItemTags(items, colorIdx) {
  if (!items.length) return '<div class="empty-hint">暂无内容，请粘贴姓名或上传文件</div>';
  var col = getListColor(colorIdx);
  var html = '';
  var limit = Math.min(items.length, 50);
  for (var i = 0; i < limit; i++) {
    html += '<span class="tag" style="background:' + col.bg + ';color:' + col.fg + '">' + escHtml(items[i]) + '</span>';
  }
  if (items.length > 50) html += '<span class="tag">...还有 ' + (items.length - 50) + ' 项</span>';
  return html;
}

function onTextareaChange(listId) {
  var ta = document.getElementById('ta-' + listId);
  if (!ta) return;
  // Update line count immediately
  var lines = ta.value.split(/[\n\r]+/).filter(function(l){ return l.trim(); });
  var group = ta.closest('.list-group');
  if (group) {
    var countEl = group.querySelector('.list-count');
    if (countEl) countEl.textContent = lines.length + ' 行';
  }
  // Debounce collect + update preview only (don't rebuild the whole form)
  clearTimeout(collectTimer);
  collectTimer = setTimeout(function(){
    collectItems();
    // Update preview and count for this specific list only
    var list = state.lists.find(function(l){ return l.id === listId; });
    if (list) {
      var preview = document.getElementById('preview-' + listId);
      var idx = state.lists.indexOf(list);
      if (preview && idx >= 0) preview.innerHTML = renderItemTags(list.items, idx);
      var cnt = group.querySelector('.list-count');
      if (cnt) cnt.textContent = list.items.length + ' 项';
    }
  }, 400);
}

function addList() {
  if (state.lists.length >= 6) { toast('最多支持 6 个名单', 'error'); return; }
  collectItems();
  var chars = 'ABCDEF';
  var label = '名单 ' + chars[state.lists.length];
  state.lists.push({ id: state.nextId, label: label, items: [] });
  state.nextId++;
  saveState();
  renderListInputs();
  toast('已添加 ' + label);
  // Scroll to new list
  setTimeout(function(){
    var groups = document.querySelectorAll('.list-group');
    var last = groups[groups.length - 1];
    if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function removeList(listId) {
  if (state.lists.length <= 2) return;
  state.lists = state.lists.filter(function(l){ return l.id !== listId; });
  resultsCache = null;
  saveState();
  renderListInputs();
  toast('已删除名单');
}

function updateListLabel(listId, label) {
  var list = state.lists.find(function(l){ return l.id === listId; });
  if (list) { list.label = label; saveState(); }
}

function handleListFileUpload(input) {
  var listId = parseInt(input.dataset.listId || '');
  if (!listId) return;
  var file = input.files[0];
  if (!file) return;
  var ext = file.name.split('.').pop().toLowerCase();
  var reader = new FileReader();

  if (ext === 'csv' || ext === 'xlsx' || ext === 'xls') {
    reader.onload = function(e) {
      try {
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type: 'array'});
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, {header: 1});
        previewData = { rows: rows, listId: listId, fileName: file.name };
        previewSelectedCol = -1;
        openFilePreview();
      } catch(ex) {
        toast('文件解析失败，请确认格式', 'error');
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    reader.onload = function(e) {
      var text = e.target.result;
      var lines = text.split(/[\n\r]+/);
      var rows = lines.map(function(l){ return [l]; });
      previewData = { rows: rows, listId: listId, fileName: file.name };
      previewSelectedCol = -1;
      openFilePreview();
    };
    reader.readAsText(file, 'UTF-8');
  }
  input.value = '';
}

// ==================== FILE PREVIEW MODAL ====================
function openFilePreview() {
  if (!previewData) return;
  var list = state.lists.find(function(l){ return l.id === previewData.listId; });
  document.getElementById('previewTargetLabel').textContent = list ? list.label : '';

  var rows = previewData.rows;
  var maxCols = 0;
  for (var i = 0; i < rows.length; i++) {
    if (rows[i] && rows[i].length > maxCols) maxCols = rows[i].length;
  }
  if (maxCols === 0) { toast('文件中没有数据', 'error'); return; }

  var html = '<table class="preview-table"><thead><tr><th style="width:36px;cursor:default;background:var(--gray-50)">#</th>';
  for (var c = 0; c < maxCols; c++) {
    var label = c < 26 ? String.fromCharCode(65 + c) : String(c + 1);
    html += '<th onclick="selectPreviewCol(' + c + ')" id="prevCol-' + c + '">' + label + '</th>';
  }
  html += '</tr></thead><tbody>';
  var showRows = Math.min(rows.length, 100);
  for (var r = 0; r < showRows; r++) {
    html += '<tr><td class="row-num">' + (r+1) + '</td>';
    for (var c = 0; c < maxCols; c++) {
      var val = (rows[r] && rows[r][c] != null) ? String(rows[r][c]) : '';
      html += '<td>' + escHtml(val) + '</td>';
    }
    html += '</tr>';
  }
  if (rows.length > 100) {
    html += '<tr><td class="row-num" colspan="' + (maxCols+1) + '" style="text-align:center;color:var(--gray-400);padding:12px">... 还有 ' + (rows.length-100) + ' 行未显示</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('previewTableWrap').innerHTML = html;

  document.getElementById('previewRowStart').value = 1;
  document.getElementById('previewRowEnd').value = rows.length;
  document.getElementById('previewRowEnd').setAttribute('max', rows.length);

  document.getElementById('filePreviewModal').classList.add('show');
}

function selectPreviewCol(col) {
  if (previewSelectedCol === col) { previewSelectedCol = -1; }
  else { previewSelectedCol = col; }
  var c = 0;
  while (true) {
    var th = document.getElementById('prevCol-' + c);
    if (!th) break;
    th.classList.toggle('selected', c === previewSelectedCol);
    c++;
  }
}

function closeFilePreview() {
  document.getElementById('filePreviewModal').classList.remove('show');
  previewData = null;
  previewSelectedCol = -1;
}

function confirmFileImport() {
  if (!previewData) return;
  var rows = previewData.rows;
  var listId = previewData.listId;

  var startRow = parseInt(document.getElementById('previewRowStart').value) || 1;
  var endRow = parseInt(document.getElementById('previewRowEnd').value) || rows.length;
  startRow = Math.max(1, Math.min(startRow, rows.length));
  endRow = Math.max(startRow, Math.min(endRow, rows.length));

  var names = [];
  if (previewSelectedCol >= 0) {
    for (var r = startRow - 1; r < endRow; r++) {
      var row = rows[r];
      if (!row) continue;
      var val = String(row[previewSelectedCol] || '').trim();
      if (val) names.push(val);
    }
  } else {
    names = autoExtractNames(rows, startRow - 1, endRow);
  }

  if (names.length === 0) {
    toast('未提取到数据，请点击列标题选择要导入的列', 'error');
    return;
  }

  setListItems(listId, names);
  closeFilePreview();
}

function autoExtractNames(rows, startIdx, endIdx) {
  var names = [];
  for (var r = startIdx; r < endIdx; r++) {
    var row = rows[r];
    if (!row) continue;
    for (var c = 0; c < row.length; c++) {
      var v = String(row[c] || '').trim();
      if (v && !/^(姓名|名字|名称|name|序号|编号|ID)$/i.test(v)) names.push(v);
    }
  }
  return names;
}

function setListItems(listId, names) {
  var list = state.lists.find(function(l){ return l.id === listId; });
  if (!list) return;
  var seen = {};
  var items = [];
  for (var i = 0; i < names.length; i++) {
    var item = names[i].trim();
    var key = normalize(item);
    if (item && !seen[key]) { seen[key] = true; items.push(item); }
  }
  list.items = items;
  resultsCache = null;
  saveState();
  renderListInputs();
  toast('已导入 ' + items.length + ' 项到 ' + list.label, 'success');
}

function toggleCase() {
  state.caseSensitive = document.getElementById('optCase').checked;
  resultsCache = null;
  saveState();
  // Re-render results if on that tab
  if (state.activeTab === 1) renderResults();
}

// ==================== PANEL 1: COMPARISON ALGORITHMS ====================
function computeAll() {
  collectItems();
  if (resultsCache) return resultsCache;

  var lists = state.lists;
  // Build normalized sets per list
  var sets = [];
  var origMap = [];
  for (var i = 0; i < lists.length; i++) {
    var s = {};
    origMap[i] = {};
    for (var j = 0; j < lists[i].items.length; j++) {
      var item = lists[i].items[j];
      var n = normalize(item);
      s[n] = true;
      if (!origMap[i][n]) origMap[i][n] = item;
    }
    sets.push(s);
  }

  // Union tracking — each unique normalized item and which lists have it
  var allItems = {};
  for (var i = 0; i < sets.length; i++) {
    var keys = Object.keys(sets[i]);
    for (var k = 0; k < keys.length; k++) {
      var n = keys[k];
      if (!allItems[n]) allItems[n] = { normalized: n, presentIn: [], original: origMap[i][n] };
      allItems[n].presentIn.push(i);
    }
  }
  var allKeys = Object.keys(allItems);

  // Intersection: in ALL lists
  var intersection = [];
  for (var i = 0; i < allKeys.length; i++) {
    var item = allItems[allKeys[i]];
    if (item.presentIn.length === lists.length) intersection.push(item);
  }

  // Per-list unique items (present in exactly 1 list)
  var perListUnique = [];
  for (var i = 0; i < lists.length; i++) {
    perListUnique.push({ listId: lists[i].id, label: lists[i].label, items: [] });
  }
  for (var i = 0; i < allKeys.length; i++) {
    var item = allItems[allKeys[i]];
    if (item.presentIn.length === 1) {
      perListUnique[item.presentIn[0]].items.push(item);
    }
  }

  // Union: all unique items
  var union = [];
  for (var i = 0; i < allKeys.length; i++) {
    union.push(allItems[allKeys[i]]);
  }

  // Side-by-side: sorted by presence count (desc), then alphabetically
  var sideBySide = union.slice().sort(function(a, b){
    if (b.presentIn.length !== a.presentIn.length) return b.presentIn.length - a.presentIn.length;
    return a.normalized.localeCompare(b.normalized);
  });

  resultsCache = {
    intersection: intersection,
    perListUnique: perListUnique,
    union: union,
    sideBySide: sideBySide
  };
  return resultsCache;
}

// ==================== PANEL 1: RENDER ====================
function renderResults() {
  var results = computeAll();
  var lists = state.lists;
  var mode = state.mode;

  // ---- Stat cards ----
  var statsHtml = '';
  if (lists.length === 2) {
    var uniqueA = results.perListUnique[0].items.length;
    var uniqueB = results.perListUnique[1].items.length;
    var common = results.intersection.length;
    var total = results.union.length;
    statsHtml += '<div class="stat-card" style="border-top:3px solid ' + getListColor(0).fg + '"><div class="stat-num">' + uniqueA + '</div><div class="stat-label">仅 ' + escHtml(lists[0].label) + '</div></div>';
    statsHtml += '<div class="stat-card" style="border-top:3px solid var(--primary)"><div class="stat-num">' + common + '</div><div class="stat-label">共同项</div></div>';
    statsHtml += '<div class="stat-card" style="border-top:3px solid ' + getListColor(1).fg + '"><div class="stat-num">' + uniqueB + '</div><div class="stat-label">仅 ' + escHtml(lists[1].label) + '</div></div>';
    statsHtml += '<div class="stat-card"><div class="stat-num">' + total + '</div><div class="stat-label">并集总数</div></div>';
  } else {
    statsHtml += '<div class="stat-card" style="border-top:3px solid var(--primary)"><div class="stat-num">' + results.intersection.length + '</div><div class="stat-label">共同项</div></div>';
    statsHtml += '<div class="stat-card"><div class="stat-num">' + results.union.length + '</div><div class="stat-label">并集总数</div></div>';
    for (var i = 0; i < lists.length; i++) {
      statsHtml += '<div class="stat-card" style="border-top:3px solid ' + getListColor(i).fg + '"><div class="stat-num">' + results.perListUnique[i].items.length + '</div><div class="stat-label">仅 ' + escHtml(lists[i].label) + '</div></div>';
    }
  }
  document.getElementById('statCards').innerHTML = statsHtml;

  // ---- Results area ----
  var area = document.getElementById('resultsArea');
  var totalItems = results.union.length;
  if (totalItems === 0) {
    area.innerHTML = '<div class="no-results"><div class="icon">&#128269;</div><p>请先在"输入名单"中添加内容</p></div>';
    return;
  }

  var html = '';

  // -- Intersection mode --
  if (mode === 'intersection') {
    html += '<div class="result-section"><div class="section-title">共同项（在所有 ' + lists.length + ' 个名单中都存在）<span class="list-count">' + results.intersection.length + ' 项</span></div>';
    html += '<div class="result-list">';
    if (results.intersection.length === 0) {
      html += '<span class="empty-hint">没有在所有名单中都存在的项</span>';
    } else {
      for (var i = 0; i < results.intersection.length; i++) {
        html += '<span class="tag" style="background:var(--primary-light);color:var(--primary);font-weight:500">' + escHtml(results.intersection[i].original) + '</span>';
      }
    }
    html += '</div></div>';
  }

  // -- Unique mode --
  if (mode === 'unique') {
    for (var i = 0; i < lists.length; i++) {
      var col = getListColor(i);
      var uniq = results.perListUnique[i];
      html += '<div class="result-section"><div class="section-title"><span class="list-badge" style="background:' + col.bg + ';color:' + col.fg + '">' + escHtml(uniq.label) + '</span>独有项 <span class="list-count">' + uniq.items.length + ' 项</span></div>';
      html += '<div class="result-list">';
      if (uniq.items.length === 0) {
        html += '<span class="empty-hint">' + escHtml(uniq.label) + ' 没有独有项</span>';
      } else {
        for (var j = 0; j < uniq.items.length; j++) {
          html += '<span class="tag" style="background:' + col.bg + ';color:' + col.fg + '">' + escHtml(uniq.items[j].original) + '</span>';
        }
      }
      html += '</div></div>';
    }
  }

  // -- Union mode --
  if (mode === 'union') {
    html += '<div class="result-section"><div class="section-title">并集 <span class="list-count">' + results.union.length + ' 项</span></div>';
    html += '<div class="result-list">';
    for (var i = 0; i < results.union.length; i++) {
      var item = results.union[i];
      html += '<span class="tag" style="min-height:36px;padding:6px 12px">' + escHtml(item.original);
      for (var j = 0; j < item.presentIn.length; j++) {
        var col2 = getListColor(item.presentIn[j]);
        html += '<span class="list-badge" style="background:' + col2.bg + ';color:' + col2.fg + ';font-size:10px;padding:2px 7px;margin-left:2px">' + escHtml(lists[item.presentIn[j]].label) + '</span>';
      }
      html += '</span>';
    }
    html += '</div></div>';
  }

  // -- Side-by-side mode (table + mobile cards) --
  if (mode === 'side-by-side') {
    html += '<div class="result-section"><div class="section-title">逐项对照 <span class="list-count">' + results.sideBySide.length + ' 项</span></div>';

    // Desktop table
    html += '<div class="compare-table-wrap"><table class="compare-table"><thead><tr><th>#</th><th>项目</th>';
    for (var i = 0; i < lists.length; i++) {
      var col = getListColor(i);
      html += '<th class="cell-list"><span class="list-badge" style="background:' + col.bg + ';color:' + col.fg + '">' + escHtml(lists[i].label) + '</span></th>';
    }
    html += '</tr></thead><tbody>';
    for (var i = 0; i < results.sideBySide.length; i++) {
      var item = results.sideBySide[i];
      html += '<tr><td style="color:var(--gray-400);font-size:12px">' + (i+1) + '</td><td>' + escHtml(item.original) + '</td>';
      for (var j = 0; j < lists.length; j++) {
        var present = item.presentIn.indexOf(j) >= 0;
        html += '<td class="cell-list">' + (present ? '<span class="mark-yes">&#10003;</span>' : '<span class="mark-no">&#10007;</span>') + '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table></div>';

    // Mobile cards
    html += '<div class="card-list">';
    for (var i = 0; i < results.sideBySide.length; i++) {
      var item = results.sideBySide[i];
      html += '<div class="card-item"><div class="card-name">' + (i+1) + '. ' + escHtml(item.original) + '</div><div class="card-lists">';
      for (var j = 0; j < lists.length; j++) {
        var col = getListColor(j);
        var present = item.presentIn.indexOf(j) >= 0;
        html += '<span class="card-badge ' + (present ? 'in' : 'out') + '" style="background:' + (present ? col.bg : 'var(--gray-100)') + ';color:' + (present ? col.fg : 'var(--gray-400)') + '">';
        html += (present ? '&#10003;' : '&#10007;') + ' ' + escHtml(lists[j].label);
        html += '</span>';
      }
      html += '</div></div>';
    }
    html += '</div>';
    html += '<div class="mobile-swipe-hint">&#8592; 横向滑动查看更多 &#8594;</div>';
  }

  area.innerHTML = html;
}

function switchMode(mode) {
  state.mode = mode;
  var modes = ['side-by-side', 'intersection', 'unique', 'union'];
  var btns = document.querySelectorAll('.mode-btn');
  for (var i = 0; i < btns.length; i++) { btns[i].classList.toggle('active', modes[i] === mode); }
  saveState();
  renderResults();
}

function modeText(mode) {
  var map = { 'side-by-side': '逐项对照', 'intersection': '交集', 'unique': '独有项', 'union': '并集' };
  return map[mode] || mode;
}

// ==================== PANEL 2: EXPORT ====================
function renderExport() {
  var results = computeAll();
  var text = formatExportText(results, state.lists, state.mode);
  document.getElementById('exportPreview').textContent = text || '（没有可导出的内容）';
}

function formatExportText(results, lists, mode) {
  var lines = [];
  lines.push('名单对比工具 — 导出结果');
  lines.push('对比模式: ' + modeText(mode));
  lines.push('生成时间: ' + new Date().toLocaleString());
  lines.push('');

  lines.push('--- 统计 ---');
  for (var i = 0; i < lists.length; i++) {
    lines.push(lists[i].label + ': ' + lists[i].items.length + ' 项');
  }
  lines.push('共同项: ' + results.intersection.length);
  lines.push('并集总数: ' + results.union.length);
  lines.push('');

  if (mode === 'intersection') {
    lines.push('--- 共同项 (' + results.intersection.length + ') ---');
    for (var i = 0; i < results.intersection.length; i++) {
      lines.push(results.intersection[i].original);
    }
  }

  if (mode === 'unique') {
    for (var i = 0; i < lists.length; i++) {
      var uniq = results.perListUnique[i];
      lines.push('--- 仅 ' + uniq.label + ' (' + uniq.items.length + ') ---');
      for (var j = 0; j < uniq.items.length; j++) {
        lines.push(uniq.items[j].original);
      }
      lines.push('');
    }
  }

  if (mode === 'union') {
    lines.push('--- 并集 (' + results.union.length + ') ---');
    for (var i = 0; i < results.union.length; i++) {
      var item = results.union[i];
      var labels = item.presentIn.map(function(idx){ return lists[idx].label; });
      lines.push(item.original + ' [' + labels.join(', ') + ']');
    }
  }

  if (mode === 'side-by-side') {
    lines.push('--- 逐项对照 (' + results.sideBySide.length + ') ---');
    var header = '项目\t';
    for (var i = 0; i < lists.length; i++) { header += lists[i].label + '\t'; }
    lines.push(header);
    for (var i = 0; i < results.sideBySide.length; i++) {
      var item = results.sideBySide[i];
      var row = item.original + '\t';
      for (var j = 0; j < lists.length; j++) {
        row += (item.presentIn.indexOf(j) >= 0 ? '✓' : '✗') + '\t';
      }
      lines.push(row);
    }
  }

  return lines.join('\n');
}

function exportTXT() {
  var results = computeAll();
  var text = formatExportText(results, state.lists, state.mode);
  downloadBlob(text, '名单对比结果.txt', 'text/plain;charset=utf-8');
  toast('已导出 TXT', 'success');
}

function exportCSV() {
  var results = computeAll();
  var text = formatExportText(results, state.lists, state.mode);
  downloadBlob('﻿' + text, '名单对比结果.csv', 'text/csv;charset=utf-8');
  toast('已导出 CSV', 'success');
}

function exportExcel() {
  var results = computeAll();
  var lists = state.lists;
  var mode = state.mode;

  var sheetData = [['名单对比工具 — 导出结果']];
  sheetData.push(['对比模式: ' + modeText(mode)]);
  sheetData.push(['生成时间: ' + new Date().toLocaleString()]);
  sheetData.push([]);
  sheetData.push(['名单', '项目数']);
  for (var i = 0; i < lists.length; i++) {
    sheetData.push([lists[i].label, lists[i].items.length]);
  }
  sheetData.push([]);

  if (mode === 'side-by-side') {
    var header = ['项目'];
    for (var i = 0; i < lists.length; i++) header.push(lists[i].label);
    sheetData.push(header);
    for (var i = 0; i < results.sideBySide.length; i++) {
      var item = results.sideBySide[i];
      var rowData = [item.original];
      for (var j = 0; j < lists.length; j++) {
        rowData.push(item.presentIn.indexOf(j) >= 0 ? '✓' : '✗');
      }
      sheetData.push(rowData);
    }
  } else {
    var text = formatExportText(results, lists, mode);
    var lines = text.split('\n');
    for (var i = 0; i < lines.length; i++) {
      sheetData.push([lines[i]]);
    }
  }

  var ws = XLSX.utils.aoa_to_sheet(sheetData);
  // Set column width for better readability
  ws['!cols'] = [{wch: 20}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '对比结果');
  XLSX.writeFile(wb, '名单对比结果.xlsx');
  toast('已导出 Excel', 'success');
}

function copyToClipboard() {
  var results = computeAll();
  var text = formatExportText(results, state.lists, state.mode);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){
      toast('已复制到剪贴板', 'success');
    }).catch(function(){
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); toast('已复制到剪贴板', 'success'); }
  catch(e) { toast('复制失败，请手动选择预览区内容复制', 'error'); }
  document.body.removeChild(ta);
}

function downloadBlob(content, filename, mime) {
  var blob = new Blob([content], {type: mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 200);
}

// ==================== SAVE / LOAD PROJECT ====================
function saveToFile() {
  collectItems();
  var json = JSON.stringify(state, null, 2);
  downloadBlob(json, '名单对比项目.json', 'application/json');
  toast('项目已保存', 'success');
}

function loadFromFile(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (data.lists && Array.isArray(data.lists)) {
        state = data;
        if (!state.nextId) state.nextId = Math.max.apply(null, state.lists.map(function(l){ return l.id; })) + 1;
        if (!state.mode) state.mode = 'side-by-side';
        resultsCache = null;
        saveState();
        renderListInputs();
        switchTab(state.activeTab || 0);
        toast('项目已加载', 'success');
      } else {
        toast('无效的项目文件', 'error');
      }
    } catch(err) {
      toast('文件解析失败', 'error');
    }
  };
  reader.readAsText(file, 'UTF-8');
  input.value = '';
}

function resetAll() {
  if (!confirm('确定要清空所有名单和对比结果吗？此操作不可撤销。')) return;
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  resultsCache = null;
  saveState();
  renderListInputs();
  document.getElementById('resultsArea').innerHTML = '';
  document.getElementById('statCards').innerHTML = '';
  document.getElementById('exportPreview').textContent = '请先在"对比结果"中查看对比，然后回到此处导出。';
  switchTab(0);
  toast('已清空');
}

// ==================== INIT ====================
function init() {
  document.getElementById('optCase').checked = state.caseSensitive;
  renderListInputs();
  switchTab(state.activeTab);
}

init();
</script>
</body>
</html>
